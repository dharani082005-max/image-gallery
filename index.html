<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frame by Frame — Image Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <h1>Frame by Frame</h1>
    <p>A small gallery of landscapes, animals and cityscapes. Pick a category, click a photo to open it.</p>
    <nav class="filters" id="filters" aria-label="Filter images by category"></nav>
  </header>

  <main>
    <p class="count" id="count" aria-live="polite"></p>
    <section class="gallery" id="gallery" aria-label="Image gallery"></section>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
    <button class="lb-btn lb-close" id="lbClose" aria-label="Close viewer">&times;</button>
    <button class="lb-btn lb-prev" id="lbPrev" aria-label="Previous image">&#8249;</button>
    <figure class="lb-figure">
      <img id="lbImg" alt="" />
      <figcaption>
        <span id="lbCaption"></span>
        <span id="lbCounter" class="lb-counter"></span>
      </figcaption>
    </figure>
    <button class="lb-btn lb-next" id="lbNext" aria-label="Next image">&#8250;</button>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
